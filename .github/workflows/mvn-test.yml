name: VanillaCore continuous integration

on:
  push:
    branches: [master]
  
  pull_request:
    branches:
      - '**'

  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu, windows]
    runs-on: ${{ matrix.os }}-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Validate research tooling and documentation
        run: |
          python -m unittest discover -s scripts/tests -v
          python -m scripts.research.check_document_links
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'oracle'
          cache: maven
      - run: mvn --batch-mode test
